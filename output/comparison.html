<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #020617;
    color: #E2E8F0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
  }

  .header {
    text-align: center;
    margin-bottom: 32px;
  }
  .header h1 {
    font-size: 2rem;
    font-weight: 700;
    background: linear-gradient(135deg, #3B82F6, #8B5CF6, #06B6D4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }
  .header p {
    font-size: 0.9rem;
    color: #64748B;
  }

  .tab-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .tab-btn {
    background: #1E293B;
    border: 1px solid #334155;
    color: #94A3B8;
    padding: 8px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    transition: all 0.2s;
  }
  .tab-btn:hover {
    background: #334155;
    color: #E2E8F0;
    border-color: #475569;
  }
  .tab-btn.active {
    background: linear-gradient(135deg, #3B82F6, #8B5CF6);
    border-color: transparent;
    color: white;
    box-shadow: 0 0 16px rgba(59,130,246,0.4);
  }

  .tab-panel {
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    border: 1px solid #1E293B;
  }

  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-top: 24px;
    width: 100%;
    max-width: 760px;
  }

  .metric-card {
    background: #1E293B;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 16px;
    text-align: center;
    transition: transform 0.2s;
  }
  .metric-card:hover {
    transform: translateY(-2px);
    border-color: #475569;
  }
  .metric-card .value {
    font-size: 1.6rem;
    font-weight: 700;
    color: #3B82F6;
    margin-bottom: 4px;
  }
  .metric-card .label {
    font-size: 0.75rem;
    color: #64748B;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .footer {
    margin-top: 40px;
    text-align: center;
    color: #334155;
    font-size: 0.75rem;
  }
</style>
</head>
